services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: halaqa_fateh
      POSTGRES_USER: halaqa
      POSTGRES_PASSWORD: halaqa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halaqa -d halaqa_fateh"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

