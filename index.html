<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة متابعة الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip for Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideInUp 0.3s ease-out forwards; }
        .day-card.active { background-color: #10b981; color: white; border-color: #10b981; transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }
        .filter-tab { transition: all 0.2s ease; }
        .filter-tab.active { background-color: #1e293b; color: white; border-color: #1e293b; }
        .filter-tab.inactive { background-color: white; color: #475569; border-color: #e2e8f0; }
        .loading-overlay { background: rgba(255,255,255,0.8); backdrop-filter: blur(2px); z-index: 100; }
    </style>
</head>
<body class="text-slate-800 pb-24 min-h-screen flex flex-col">

<!-- Header -->
<header class="fixed top-0 left-0 right-0 bg-white/95 backdrop-blur-sm z-50 shadow-sm border-b border-slate-200 transition-all duration-300" id="main-header">
    <div class="container mx-auto py-3">
        <div class="flex justify-between items-center gap-2 px-4">
            <div class="flex-1 min-w-0">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2 truncate">
                    <i data-lucide="book-open" class="w-5 h-5 text-emerald-600 flex-shrink-0"></i>
                    <span class="truncate">حلقة الفتح</span>
                </h1>
                <div class="text-slate-500 text-xs font-medium mt-1 truncate" id="header-hijri-date"></div>
            </div>
            <div class="flex gap-2 flex-shrink-0">
                <!-- Data Management Button -->
                <button onclick="openDataModal()" class="p-1.5 text-slate-400 hover:text-emerald-600 transition-colors" title="البيانات">
                    <i data-lucide="folder-cog" class="w-5 h-5"></i>
                </button>
                <button onclick="goToToday()" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm hover:bg-emerald-700 transition-colors">
                    اليوم
                </button>
            </div>
        </div>
        <div class="mt-3 flex gap-2 overflow-x-auto no-scrollbar px-4 pb-1" id="day-strip"></div>
        <div class="mt-2 flex items-center gap-2 overflow-x-auto no-scrollbar px-4 pb-3" id="lecturer-tabs"></div>
    </div>
</header>

<!-- Main Content -->
<main class="container mx-auto px-4 pt-64 flex-1 transition-all duration-300" id="main-content"></main>

<!-- Data Import/Export Modal -->
<div id="modal-data" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-slide-up">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-lg flex items-center gap-2">
                <i data-lucide="database" class="w-5 h-5 text-slate-400"></i>
                إدارة البيانات
            </h3>
            <button onclick="closeModal('modal-data')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>

        <div class="space-y-4">
            <!-- Export -->
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                <div class="flex items-center gap-3 mb-3">
                    <div class="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="download" class="w-5 h-5"></i></div>
                    <div>
                        <div class="font-bold text-sm text-slate-700">تصدير البيانات</div>
                        <div class="text-xs text-slate-500">تحميل ملف ZIP للحفظ</div>
                    </div>
                </div>
                <button onclick="exportData()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-blue-700 transition-colors">
                    تحميل النسخة الاحتياطية
                </button>
            </div>

            <!-- Import -->
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                <div class="flex items-center gap-3 mb-3">
                    <div class="bg-emerald-100 p-2 rounded-lg text-emerald-600"><i data-lucide="upload" class="w-5 h-5"></i></div>
                    <div>
                        <div class="font-bold text-sm text-slate-700">استيراد بيانات</div>
                        <div class="text-xs text-slate-500">استعادة ملف ZIP سابق</div>
                    </div>
                </div>
                <label class="block w-full">
                    <input type="file" id="import-file" accept=".zip" class="hidden" onchange="importData(this)">
                    <div class="w-full bg-white border border-dashed border-slate-300 text-slate-500 py-2.5 rounded-lg font-bold text-sm hover:bg-slate-50 transition-colors cursor-pointer text-center">
                        اختر ملف ZIP
                    </div>
                </label>
            </div>

            <div class="text-[10px] text-slate-400 text-center pt-2">
                البيانات تحفظ محلياً في المتصفح تلقائياً. هذا الخيار للنقل والحفظ الخارجي.
            </div>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loading-overlay" class="fixed inset-0 loading-overlay flex items-center justify-center hidden">
    <div class="bg-white px-6 py-4 rounded-xl shadow-xl border border-slate-100 flex items-center gap-3">
        <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-emerald-600"></div>
        <span class="font-medium text-slate-600 text-sm" id="loading-text">جاري العمل...</span>
    </div>
</div>

<!-- Modals (Teachers/Students) -->
<div id="modal-manage-teachers" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-0 shadow-2xl animate-slide-up overflow-hidden flex flex-col max-h-[80vh]">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-lg">إدارة الحلقات</h3>
            <button onclick="closeModal('modal-manage-teachers')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="p-4 border-b border-slate-100 bg-white">
            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">إضافة حلقة جديدة</label>
            <div class="flex gap-2">
                <input type="text" id="input-new-teacher" class="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="اسم المعلم...">
                <button onclick="addTeacher()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-700 transition-colors">إضافة</button>
            </div>
        </div>
        <div class="p-4 overflow-y-auto flex-1 bg-slate-50/50">
            <label class="block text-xs font-bold text-slate-500 mb-3 uppercase">الحلقات الحالية</label>
            <div id="teachers-list-container" class="space-y-2"></div>
        </div>
    </div>
</div>

<div id="modal-add-student" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl animate-slide-up">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-lg">إضافة طالب جديد</h3>
            <button onclick="closeModal('modal-add-student')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">اسم الطالب</label>
                <input type="text" id="input-student-name" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="الاسم الثلاثي">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">سنة الميلاد (اختياري)</label>
                <input type="number" id="input-student-birth" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="YYYY">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">الحلقة (المعلم)</label>
                <select id="input-student-teacher" class="w-full border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white"></select>
            </div>
            <button onclick="addStudent()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition-colors">إضافة الطالب</button>
        </div>
    </div>
</div>

<!-- Rename Teacher Modal -->
<div id="modal-rename-teacher" class="fixed inset-0 bg-black/60 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl w-full max-w-xs p-5 shadow-2xl animate-slide-up">
        <h3 class="font-bold text-lg mb-4">تعديل الاسم</h3>
        <input type="hidden" id="rename-teacher-id">
        <input type="text" id="input-rename-teacher" class="w-full border border-slate-200 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <div class="flex gap-2">
            <button onclick="saveRenamedTeacher()" class="flex-1 bg-slate-800 text-white py-2 rounded-lg font-bold text-sm">حفظ</button>
            <button onclick="closeModal('modal-rename-teacher')" class="flex-1 bg-slate-100 text-slate-600 py-2 rounded-lg font-bold text-sm">إلغاء</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800/90 backdrop-blur text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 transition-opacity duration-300 flex items-center gap-2 pointer-events-none z-50">
    <i data-lucide="check-circle" class="w-3 h-3 text-emerald-400"></i>
    <span>تم الحفظ</span>
</div>

<script>
    // --- CSV Helpers ---
    const CSV = {
        parse(text) {
            const lines = text.trim().split('\n');
            return lines.slice(1).map(line => line.split(',').map(v => v.trim()));
        },
        stringify(headers, rows) {
            const headerLine = headers.join(',');
            const dataLines = rows.map(r => r.join(','));
            return [headerLine, ...dataLines].join('\n');
        }
    };

    // --- Date Helpers (Hijri Key System) ---
    const HijriService = {
        formatter: new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {
            year: 'numeric', month: 'numeric', day: 'numeric'
        }),
        getMonthPath(date) {
            const parts = this.formatter.formatToParts(date);
            const y = parts.find(p => p.type === 'year').value;
            const m = parts.find(p => p.type === 'month').value;
            return `${y}/${m}`;
        },
        getDayKey(date) {
            const parts = this.formatter.formatToParts(date);
            const y = parts.find(p => p.type === 'year').value;
            const m = parts.find(p => p.type === 'month').value;
            const d = parts.find(p => p.type === 'day').value;
            return `${y}-${m}-${d}`;
        }
    };

    // --- State ---
    let state = {
        currentDate: new Date(),
        todayDate: new Date(),
        startDate: new Date(),
        filterTeacher: 'all',
        teachers: [], // { id: -1, name: 'X' }
        students: [], // { id: 1, name: 'Y', birth_year: 2000, defaultTeacherId: -1 }
        dailyData: {}, // Keyed by "Year-Month-Day" (Hijri)
        teacherOverrides: {}
    };

    // --- Core Logic ---
    function init() {
        const now = new Date();
        state.todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        state.currentDate = new Date(state.todayDate);
        state.startDate = new Date(state.todayDate);

        loadLocalData();
        render();
        setupSwipeGestures();
    }

    function loadLocalData() {
        const saved = localStorage.getItem('halqa_local_v5');
        if (saved) {
            const parsed = JSON.parse(saved);
            state.teachers = parsed.teachers || [];
            state.students = parsed.students || [];
            state.dailyData = parsed.dailyData || {};
            // Calc start date
            const keys = Object.keys(state.dailyData).sort();
            if (keys.length > 0) {
                // Note: keys are Hijri strings, not strict Date parseable directly by JS Date without conversion logic
                // For simple UI bound, we just stick to today, or we can parse if needed.
                // For this demo, let's default to Today as start if parsing is complex, or allow infinite scroll back.
            }
        }
    }

    function saveLocalData() {
        localStorage.setItem('halqa_local_v5', JSON.stringify({
            teachers: state.teachers,
            students: state.students,
            dailyData: state.dailyData
        }));
        showToast();
    }

    // --- Import / Export Logic (ZIP) ---

    async function exportData() {
        const zip = new JSZip();

        // 1. Create data/database/Users.csv
        const tRows = state.teachers.map(t => [t.id, t.name, '']);
        const sRows = state.students.map(s => [s.id, s.name, s.birth_year || '']);
        const usersCsv = CSV.stringify(['user_id', 'name', 'birth_year'], [...tRows, ...sRows]);
        zip.file("data/database/Users.csv", usersCsv);

        // 2. Group Daily Data by Month for data/database/{year}/{month}.csv
        const monthlyGroups = {};

        Object.keys(state.dailyData).forEach(dateKey => {
            // dateKey is "1446-5-3"
            const [y, m, d] = dateKey.split('-');
            const monthKey = `${y}/${m}`;

            if (!monthlyGroups[monthKey]) monthlyGroups[monthKey] = [];

            const dayEntries = state.dailyData[dateKey];
            Object.keys(dayEntries).forEach(studentId => {
                const entry = dayEntries[studentId];
                if (entry.hifz || entry.murajaah || entry.teacherId) {
                    // Schema: student_id, teacher_id, day, hifz, murajaah
                    monthlyGroups[monthKey].push([
                        studentId,
                        entry.teacherId || (state.filterTeacher !== 'all' ? state.filterTeacher : -1),
                        d,
                        entry.hifz || 0,
                        entry.murajaah || 0
                    ]);
                }
            });
        });

        // Write Monthly CSVs
        Object.keys(monthlyGroups).forEach(monthPath => {
            const rows = monthlyGroups[monthPath];
            const csvContent = CSV.stringify(['student_id', 'teacher_id', 'day', 'hifz', 'murajaah'], rows);
            zip.file(`data/database/${monthPath}.csv`, csvContent);
        });

        // Generate and Download
        const content = await zip.generateAsync({type:"blob"});
        const url = URL.createObjectURL(content);
        const a = document.createElement("a");
        a.href = url;
        a.download = "halqa_backup.zip";
        a.click();
        URL.revokeObjectURL(url);
    }

    async function importData(input) {
        const file = input.files[0];
        if (!file) return;

        showLoading(true, "جاري قراءة الملف...");

        try {
            const zip = await JSZip.loadAsync(file);

            // 1. Reset State
            state.teachers = [];
            state.students = [];
            state.dailyData = {};

            // 2. Parse Users.csv
            const usersFile = zip.file("data/database/Users.csv");
            if (usersFile) {
                const text = await usersFile.async("string");
                const rows = CSV.parse(text);
                rows.forEach(row => {
                    if (row.length < 2) return;
                    const id = parseInt(row[0]);
                    const name = row[1];
                    const birth_year = row[2] ? parseInt(row[2]) : null;
                    if (id < 0) {
                        state.teachers.push({ id, name });
                    } else {
                        state.students.push({ id, name, birth_year, defaultTeacherId: null });
                    }
                });
            }

            // 3. Parse Monthly Files
            const filePaths = Object.keys(zip.files).filter(path =>
                path.startsWith("data/database/") && path.endsWith(".csv") && !path.endsWith("Users.csv")
            );

            for (const path of filePaths) {
                // path ex: data/database/1446/5.csv
                // Extract Year/Month from path
                const parts = path.split('/'); // [data, database, 1446, 5.csv]
                if (parts.length < 4) continue;

                const year = parts[2];
                const month = parts[3].replace('.csv', '');

                const text = await zip.file(path).async("string");
                const rows = CSV.parse(text);

                rows.forEach(row => {
                    // student_id, teacher_id, day, hifz, murajaah
                    if (row.length < 5) return;
                    const sId = parseInt(row[0]);
                    const tId = parseInt(row[1]);
                    const day = parseInt(row[2]);
                    const hifz = row[3];
                    const murajaah = row[4];

                    const dateKey = `${year}-${month}-${day}`;
                    if (!state.dailyData[dateKey]) state.dailyData[dateKey] = {};

                    state.dailyData[dateKey][sId] = {
                        hifz: parseFloat(hifz) || 0,
                        murajaah: parseFloat(murajaah) || 0,
                        teacherId: tId
                    };
                });
            }

            saveLocalData();
            closeModal('modal-data');
            render();
            alert("تم استعادة البيانات بنجاح");

        } catch (e) {
            console.error(e);
            alert("خطأ في قراءة الملف: " + e.message);
        } finally {
            showLoading(false);
            input.value = ''; // Reset input
        }
    }

    // --- Actions ---

    function addTeacher() {
        const input = document.getElementById('input-new-teacher');
        const name = input.value.trim();
        if (!name) return;
        const minId = state.teachers.reduce((min, t) => Math.min(min, t.id), 0);
        const newId = minId - 1;
        state.teachers.push({ id: newId, name });
        input.value = '';
        renderTeachersList();
        render();
        saveLocalData();
    }

    function deleteTeacher(id) {
        if (isTeacherLinked(id)) return;
        if (!confirm('هل أنت متأكد؟')) return;
        state.teachers = state.teachers.filter(t => t.id != id); // Loose equality for string/int mix safety
        if (state.filterTeacher == id) state.filterTeacher = 'all';
        saveLocalData();
        renderTeachersList();
        render();
    }

    function saveRenamedTeacher() {
        const id = document.getElementById('rename-teacher-id').value;
        const newName = document.getElementById('input-rename-teacher').value.trim();
        if (!newName) return;
        const teacher = state.teachers.find(t => t.id == id);
        if (teacher) teacher.name = newName;
        saveLocalData();
        closeModal('modal-rename-teacher');
        renderTeachersList();
        render();
    }

    function addStudent() {
        const name = document.getElementById('input-student-name').value.trim();
        const birth = document.getElementById('input-student-birth').value;
        const teacherId = parseInt(document.getElementById('input-student-teacher').value);
        if (!name) return;
        const maxId = state.students.reduce((max, s) => Math.max(max, s.id), 0);
        const newId = maxId + 1;
        state.students.push({ id: newId, name, birth_year: birth || null, defaultTeacherId: teacherId });
        closeModal('modal-add-student');
        render();
        saveLocalData();
    }

    function updateScore(studentId, type, value) {
        const dateKey = HijriService.getDayKey(state.currentDate);
        if (!state.dailyData[dateKey]) state.dailyData[dateKey] = {};
        if (!state.dailyData[dateKey][studentId]) {
            let tId = -1;
            if (state.filterTeacher !== 'all') tId = state.filterTeacher;
            // Try to find implicit teacher from previous entries? For now just use filter or -1
            state.dailyData[dateKey][studentId] = { hifz: 0, murajaah: 0, teacherId: tId };
        }
        const entry = state.dailyData[dateKey][studentId];
        if (type === 'attended') {
            if (!value) delete state.dailyData[dateKey][studentId];
        } else {
            entry[type] = value;
        }
        renderMainContent();
        saveLocalData();
    }

    function setDate(offset) {
        const newDate = new Date(state.currentDate);
        newDate.setDate(newDate.getDate() + offset);
        state.currentDate = newDate;
        render();
    }
    function goToToday() {
        state.currentDate = new Date(state.todayDate);
        render();
    }

    // --- Render UI ---
    function render() {
        renderHeader();
        renderTabs();
        renderMainContent();
        lucide.createIcons();
    }

    function renderHeader() {
        const formatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
        document.getElementById('header-hijri-date').textContent = formatter.format(state.currentDate);
        const strip = document.getElementById('day-strip');
        strip.innerHTML = '';
        for (let i = -3; i <= 3; i++) {
            const d = new Date(state.currentDate);
            d.setDate(d.getDate() + i);
            const isSelected = i === 0;
            const dayFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric' });
            const dayNameFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { weekday: 'short' });
            const btn = document.createElement('button');
            btn.className = `day-card flex flex-col items-center justify-center min-w-[3.5rem] h-16 rounded-xl border transition-all duration-200 flex-shrink-0 snap-center mx-0.5 ${isSelected ? 'active shadow-md' : 'bg-white border-slate-200 text-slate-400 hover:bg-slate-50'}`;
            btn.onclick = () => setDate(i);
            btn.innerHTML = `<span class="text-[10px] font-medium">${dayNameFmt.format(d)}</span><span class="text-xl font-bold">${dayFmt.format(d)}</span>`;
            strip.appendChild(btn);
        }
    }

    function renderTabs() {
        const container = document.getElementById('lecturer-tabs');
        container.innerHTML = '';
        if (state.teachers.length > 0) container.appendChild(createTab('الكل', 'all', state.filterTeacher === 'all'));
        state.teachers.forEach(t => container.appendChild(createTab(`حلقة ${t.name}`, t.id, state.filterTeacher == t.id)));
        const settingsBtn = document.createElement('button');
        settingsBtn.className = "flex items-center justify-center w-9 h-9 rounded-full bg-slate-800 text-white shadow hover:bg-slate-700 transition-colors flex-shrink-0";
        settingsBtn.innerHTML = '<i data-lucide="settings-2" class="w-5 h-5"></i>';
        settingsBtn.onclick = openManageTeachersModal;
        container.appendChild(settingsBtn);
    }

    function createTab(label, value, isActive) {
        const btn = document.createElement('button');
        btn.className = `filter-tab px-5 py-2 rounded-full text-sm font-medium whitespace-nowrap border ${isActive ? 'active' : 'inactive'}`;
        btn.textContent = label;
        btn.onclick = () => { state.filterTeacher = value; render(); };
        return btn;
    }

    function renderMainContent() {
        const container = document.getElementById('main-content');
        container.innerHTML = '';

        if (state.teachers.length === 0) {
            container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-center animate-slide-up"><div class="bg-slate-50 p-4 rounded-full mb-4 border border-slate-100"><i data-lucide="users" class="w-10 h-10 text-slate-300"></i></div><p class="text-slate-400 font-medium mb-4 text-lg">لم يتم إضافة أي حلقة بعد</p><button onclick="openManageTeachersModal()" class="text-emerald-600 font-bold text-sm hover:text-emerald-700">+ إضافة حلقة جديدة</button></div>`;
            return;
        }

        const dateKey = HijriService.getDayKey(state.currentDate);
        const dayData = state.dailyData[dateKey] || {};

        let students = state.students.filter(s => {
            if (state.filterTeacher == 'all') return true;
            // Simple logic: if they have an entry with this teacher, show them.
            // If no entry, we rely on implicit "default" assignment which we lost in CSV but keep in RAM state.
            // For robustness, we show all in 'All' view, and try to filter by defaultTeacherId in specific views.
            // Since defaultTeacherId isn't in CSV schema, import/export might lose it (it becomes null).
            // So after import, students might float.
            // FIX: We should allow showing "Unassigned" or just show all if unsure.
            // For now: Show if they have entry match OR default match.
            const entry = dayData[s.id];
            if (entry && entry.teacherId == state.filterTeacher) return true;
            if (!entry && s.defaultTeacherId == state.filterTeacher) return true;
            return false;
        });

        if (students.length === 0) {
            container.innerHTML = `<div class="flex flex-col items-center justify-center py-16 text-center animate-slide-up"><div class="bg-slate-50 p-4 rounded-full mb-3 border border-slate-100"><i data-lucide="user" class="w-8 h-8 text-slate-300"></i></div><p class="text-slate-400 font-medium mb-4 text-lg">لا يوجد طلاب هنا</p><button onclick="openAddStudentModal()" class="text-emerald-600 font-bold text-lg hover:text-emerald-700">+ إضافة طالب جديد</button></div>`;
            return;
        }

        students.forEach(s => {
            const entry = dayData[s.id];
            const isPresent = !!entry;
            const div = document.createElement('div');
            div.className = `bg-white rounded-2xl p-5 mb-3 shadow-sm border transition-all ${isPresent ? 'border-emerald-100 shadow-md' : 'border-transparent opacity-80'}`;
            div.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-slate-100 flex items-center justify-center font-bold text-lg text-slate-500">${s.name.charAt(0)}</div>
                        <div>
                            <div class="font-bold text-slate-800">${s.name}</div>
                            <div class="text-xs text-slate-400">${entry ? getTeacherName(entry.teacherId) : 'غير محضر'}</div>
                        </div>
                    </div>
                    <button onclick="updateScore(${s.id}, 'attended', ${!isPresent})" class="w-12 h-12 rounded-xl flex items-center justify-center ${isPresent ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-300'}">
                        <i data-lucide="${isPresent ? 'check' : 'power'}" class="w-6 h-6"></i>
                    </button>
                </div>
                ${isPresent ? `<div class="grid grid-cols-2 gap-4 mt-4 animate-slide-up">
                    <div><label class="text-xs font-bold text-emerald-600">الحفظ</label><input type="number" step="0.5" class="w-full bg-slate-50 rounded-xl p-3 font-bold text-center" value="${entry.hifz}" onchange="updateScore(${s.id}, 'hifz', this.value)"></div>
                    <div><label class="text-xs font-bold text-blue-600">المراجعة</label><input type="number" step="0.5" class="w-full bg-slate-50 rounded-xl p-3 font-bold text-center" value="${entry.murajaah}" onchange="updateScore(${s.id}, 'murajaah', this.value)"></div>
                </div>` : ''}`;
            container.appendChild(div);
        });
        container.insertAdjacentHTML('beforeend', `<div class="mt-6 mb-8 text-center"><button onclick="openAddStudentModal()" class="text-emerald-600 font-bold text-sm bg-emerald-50 px-6 py-3 rounded-xl border border-emerald-100">+ إضافة طالب جديد</button></div>`);
    }

    // --- Utils ---
    function getTeacherName(id) { const t = state.teachers.find(t => t.id == id); return t ? t.name : '؟'; }
    function isTeacherLinked(id) { return state.students.some(s => s.defaultTeacherId == id); }
    function showLoading(show, text="جاري العمل...") {
        document.getElementById('loading-text').textContent = text;
        document.getElementById('loading-overlay').classList.toggle('hidden', !show);
    }
    function showToast() { const t = document.getElementById('toast'); t.classList.remove('opacity-0', 'translate-y-4'); setTimeout(() => t.classList.add('opacity-0', 'translate-y-4'), 2000); }

    function openDataModal() { document.getElementById('modal-data').classList.remove('hidden'); }
    function openManageTeachersModal() { renderTeachersList(); document.getElementById('modal-manage-teachers').classList.remove('hidden'); }
    function renderTeachersList() {
        document.getElementById('teachers-list-container').innerHTML = state.teachers.map(t => `
            <div class="flex justify-between bg-white p-3 rounded-lg border border-slate-100">
                <span class="font-medium">${t.name}</span>
                <div class="flex gap-2">
                    <button onclick="openRenameTeacher('${t.id}', '${t.name}')" class="p-1 text-slate-400 hover:text-blue-600"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    <button onclick="deleteTeacher('${t.id}')" class="p-1 text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>
            </div>`).join('');
        lucide.createIcons();
    }
    function openRenameTeacher(id, name) {
        document.getElementById('rename-teacher-id').value = id;
        document.getElementById('input-rename-teacher').value = name;
        document.getElementById('modal-rename-teacher').classList.remove('hidden');
    }
    function openAddStudentModal() {
        const sel = document.getElementById('input-student-teacher');
        sel.innerHTML = state.teachers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
        document.getElementById('modal-add-student').classList.remove('hidden');
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function setupSwipeGestures() {
        let startX = 0;
        document.addEventListener('touchstart', e => startX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            const endX = e.changedTouches[0].screenX;
            if (endX < startX - 70) setDate(1);
            if (endX > startX + 70) setDate(-1);
        });
    }
</script>
</body>
</html>
